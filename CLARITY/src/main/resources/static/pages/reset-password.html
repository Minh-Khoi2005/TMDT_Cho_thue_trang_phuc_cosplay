<a aria-label="CLARITY - Trang chủ" class="review-brand" href="../index.html"><span class="review-brand__mark">C</span><span class="review-brand__text"><b>CLARITY</b><small>Cosplay Rental</small></span></a>

<main class="auth-shell" id="main-content" tabindex="-1">
<section class="auth-card">
<h1>Đặt lại mật khẩu</h1>
<p class="auth-lead">Tạo mật khẩu mới cho tài khoản CLARITY.</p>
<form id="reset-password-form" novalidate>
<div class="form-field"><label for="new-password">Mật khẩu mới</label><div class="password-field"><input autocomplete="new-password" id="new-password" maxlength="128" minlength="8" name="password" placeholder="Ít nhất 8 ký tự và có ký tự đặc biệt" required type="password"/><button aria-label="Hiện mật khẩu" aria-pressed="false" class="password-toggle" type="button">Hiện</button></div></div>
<div class="form-field"><label for="confirm-new-password">Xác nhận mật khẩu mới</label><div class="password-field"><input autocomplete="new-password" id="confirm-new-password" maxlength="128" minlength="8" name="confirmPassword" placeholder="Nhập lại mật khẩu" required type="password"/><button aria-label="Hiện mật khẩu" aria-pressed="false" class="password-toggle" type="button">Hiện</button></div></div>
<p class="form-message" hidden role="alert"></p>
<button class="review-button primary auth-submit" type="submit">Đổi mật khẩu</button>
</form>
<p class="auth-bottom"><a href="login.html">Quay lại đăng nhập</a></p>
</section>
</main>
